[tool.poetry]
name = "categorizeai"
version = "1.0.0"
description = "Multi-Model NLP Text Classification Platform"
authors = ["Luís Fernando da Silva Santos"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/TsLu1s/categorizeai"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
pandas = ">=1.2.0"
matplotlib = ">=3.10.0"
plotly = ">=6.0.0"
wordcloud = ">=1.9.4"
langchain = "0.3.10"
langchain-community = "0.3.10"
transformers = "4.49.0"
keras = "3.8.0"
tf-keras = "2.18.0"
scikit-learn = ">=1.5.2"
catboost = ">=1.2.7"
nltk = "3.9.1"
streamlit = ">=1.39.0"
streamlit-option-menu = ">=0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
