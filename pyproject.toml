[tool.poetry]
name = "categorizeai"
version = "1.0.0"
description = "Multi-Model NLP Text Classification Platform"
authors = ["Luís Fernando da Silva Santos"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/TsLu1s/categorizeai"

[tool.poetry.dependencies]
python = "^3.10"
streamlit = "^1.39.0"
pandas = "^1.2.0"
transformers = "^4.36.0"
torch = "^2.0.0"
scikit-learn = "^1.3.0"
langchain = "0.3.27"
langchain-community = "0.3.27"
plotly = "^5.18.0"
wordcloud = "^1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"